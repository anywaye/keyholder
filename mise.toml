# Toolchain pins for keyholder. The worktree and CI must agree, so the versions
# live here rather than in whatever the machine happens to have installed.
#
# golangci-lint is the fleet's Go linter. Pinned here so `bin/gate` and CI
# agree on the version that decides whether the tree is lint-clean. The pin
# lives in one more place: `anywaye/kit/ci/ci.reusable.yml`'s
# `golangci/golangci-lint-action` step, which pins the same version via its
# `version:` input. A bump touches both, in the same commit — otherwise local
# and CI disagree, which is the defect this packet exists to close.
[tools]
go = "1.26.1"
"golangci-lint" = "2.14.0"
