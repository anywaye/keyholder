apiVersion: v1
kind: Service
metadata:
  name: keyholder
  labels:
    app.kubernetes.io/name: keyholder
    app.kubernetes.io/instance: keyholder
    app.kubernetes.io/managed-by: caf
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: keyholder
    app.kubernetes.io/instance: keyholder
