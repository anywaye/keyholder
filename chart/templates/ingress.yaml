{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.enabled is true and ingress.host is empty" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keyholder
  labels:
    app.kubernetes.io/name: keyholder
    app.kubernetes.io/instance: keyholder
    app.kubernetes.io/managed-by: caf
  {{- if .Values.ingress.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls .Values.ingress.clusterIssuer }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: keyholder-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: keyholder
                port:
                  number: {{ .Values.service.port }}
{{- end }}
